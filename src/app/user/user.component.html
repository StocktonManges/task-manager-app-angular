<div>
  <!-- If conditional styling is based on a specific class, this
  property binding can set true or false for one class instead of
  necessitating the entire class property to be bound. -->
  <button [class.active]="selected" (click)="onSelectUser()">
    <img [src]="imagePath" [alt]="user.name" />
    <span>{{ user.name }}</span>
  </button>
</div>
